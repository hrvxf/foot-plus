# Daily Google rating sync: updates each location's review count and average in
# app/lib/reviews.ts and commits to main, so the live site updates. Review text is
# still added by hand.
#
# Needs the repository secret GOOGLE_PLACES_API_KEY.

name: Google rating sync

on:
  schedule:
    - cron: "17 7 * * *" # daily, 07:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-rating
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update rating
        id: rating
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node scripts/sync-google-reviews.mjs | tee "$RUNNER_TEMP/summary.txt"

      - name: Publish rating
        if: steps.rating.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add app/lib/reviews.ts
          git commit -m "Update Google rating" -m "$(cat "$RUNNER_TEMP/summary.txt")"
          git push origin main
