<!doctype html>
<!--
  Foot+ Southampton opening post (1080 x 1350, 4:5, Facebook feed), with Katie's photo.
  Render a PNG + 8-second MP4 with render-photo-promo.py.
-->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--sage:#6C917B;--sageDark:#4F6F5F;--sageLight:#8FB39C;--offwhite:#F7F6F2;--charcoal:#243028;--wash:#E8EFE9}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{background:var(--offwhite);font-family:Inter,sans-serif;color:var(--charcoal);position:relative}
.plus{position:absolute;font-family:Poppins;font-weight:600;color:var(--sage);line-height:1}
.photo{position:absolute;left:50%;top:56px;width:420px;height:500px;margin-left:-210px;border-radius:210px 210px 26px 26px;overflow:hidden;background:var(--wash)}
.photo img{position:absolute;left:50%;top:-24px;width:500px;margin-left:-250px;transform:scale(var(--s,1));transform-origin:50% 40%}
.photo{clip-path:inset(calc(var(--c,0)*100%) 0 0 0 round 210px 210px 26px 26px)}
.name{position:absolute;left:50%;top:528px;transform:translateX(-50%) translateY(var(--y,0px));background:var(--offwhite);border:2px solid var(--line,#DCE5DE);padding:12px 28px;border-radius:999px;font-weight:600;font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:var(--sageDark);white-space:nowrap}
.wrap{position:absolute;left:0;right:0;top:622px;display:flex;flex-direction:column;align-items:center;text-align:center}
.eyebrow{font-weight:600;letter-spacing:.32em;font-size:24px;color:var(--sageDark);text-transform:uppercase;margin-bottom:22px}
h1{font-family:Poppins;font-weight:700;font-size:106px;line-height:1.0;letter-spacing:-.02em}
h1 .g{color:var(--sage)}
.rule{width:90px;height:4px;background:var(--sage);margin:28px auto 28px;border-radius:2px}
.offer{background:var(--sageDark);color:var(--offwhite);font-family:Poppins;font-weight:600;font-size:42px;padding:20px 50px;border-radius:999px}
.offer b{font-weight:700;color:#fff}
.sub{margin-top:22px;font-size:24px;line-height:1.45;color:var(--charcoal);opacity:.75}
.sub b{font-weight:600}
.brand{position:absolute;left:0;right:0;bottom:44px;display:flex;flex-direction:column;align-items:center}
.logo{width:190px;height:auto;display:block}
.brand small{display:block;font-weight:500;font-size:16px;letter-spacing:.18em;text-transform:uppercase;color:var(--charcoal);opacity:.6;margin-top:10px}
.a{opacity:var(--o,1);transform:translateY(var(--y,0px))}
.name.a{transform:translateX(-50%) translateY(var(--y,0px))}
</style></head><body>
<div id="pluses"></div>
<div class="photo" id="ph"><img src="../../../public/images/katie.jpeg" alt="Katie Preston"></div>
<div class="name a" id="nm">Meet Katie</div>
<div class="wrap">
  <div class="eyebrow a" id="e1">Now open in Southampton</div>
  <h1 class="a" id="e2">Hello,<br><span class="g">Southampton.</span></h1>
  <div class="rule a" id="e3"></div>
  <div class="offer a" id="e4"><b>Home visits</b> now booking</div>
  <div class="sub a" id="e5">Call Katie on <b>07564 614967</b></div>
</div>
<div class="brand a" id="e6"><img class="logo" src="logo-southampton-sagedark.svg" alt="Foot+ Southampton"><small>Foot care in your chair</small></div>
<script>
// [x, y, size, opacity] — kept to the outer margins, clear of photo and text
const P=[[70,90,78,.9],[200,60,32,.5],[900,80,70,.9],[1000,230,36,.5],[120,330,30,.35],[930,420,28,.35],[60,520,44,.55],[990,540,52,.6],[50,1150,56,.6],[170,1260,26,.35],[960,1140,60,.6],[880,1270,28,.35]];
const box=document.getElementById('pluses');
P.forEach((p,i)=>{const d=document.createElement('div');d.className='plus';d.id='p'+i;d.textContent='+';d.style.left=p[0]+'px';d.style.top=p[1]+'px';d.style.fontSize=p[2]+'px';d.style.opacity=p[3];box.appendChild(d)});
const ease=x=>1-Math.pow(1-Math.min(Math.max(x,0),1),3);
window.setT=function(t){
  // photo: arch reveals upward with a slow settle
  const pk=ease((t-0.1)/1.1), ph=document.getElementById('ph');
  ph.style.setProperty('--c',1-pk);
  ph.querySelector('img').style.setProperty('--s',1.08-0.08*ease((t-0.1)/3.5));
  [[0.9,'nm'],[1.3,'e1'],[1.7,'e2'],[2.4,'e3'],[2.8,'e4'],[3.4,'e5'],[3.7,'e6']].forEach(([s,id])=>{
    const k=ease((t-s)/0.7),el=document.getElementById(id);
    el.style.setProperty('--o',k);el.style.setProperty('--y',(1-k)*30+'px')});
  P.forEach((p,i)=>{const k=ease((t-(0.1+i*0.12))/0.6),el=document.getElementById('p'+i);
    el.style.opacity=p[3]*k;
    el.style.transform=`translateY(${Math.sin(t*1.6+i)*6*k}px) scale(${0.4+0.6*k}) rotate(${(1-k)*90}deg)`});
};
</script></body></html>
